    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #b9b4ac; }
    body { font-family: 'Inter', -apple-system, sans-serif; }
    #scene { position: fixed; inset: 0; display: block; }

    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 18px 26px; display: flex;
      align-items: center; justify-content: space-between; z-index: 20; pointer-events: none; }
    .brand { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
    .brand-name { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 18px;
      letter-spacing: .02em; color: #2b2926; line-height: 1.1; }
    .brand-sub { font-family: 'DM Mono', 'Courier New', monospace; font-size: 8.5px; letter-spacing: .2em;
      text-transform: uppercase; color: #6a655c; line-height: 1; }
    .mark { position: fixed; left: 26px; bottom: 20px; width: 168px; height: 44px; z-index: 11;
      opacity: .5; pointer-events: none; }
    .mark svg { width: 100%; height: 100%; display: block; }

    .intro { position: fixed; inset: 0; z-index: 30; background: #b9b4ac; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      transition: opacity .8s ease, visibility .8s; }
    .intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro .eyebrow { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: .3em;
      text-transform: uppercase; color: #6e6a62; }
    .intro h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400;
      font-size: clamp(36px, 5.6vw, 78px); color: #24211c; letter-spacing: .012em; line-height: 1.08;
      text-align: center; font-feature-settings: 'liga' 1; max-width: 88vw; text-wrap: balance; }
    .intro .rule { width: 52px; height: 1px; background: rgba(60,55,48,.38); }
    .intro .meta { font-family: 'UnifrakturMaguntia', serif; font-size: 21px; letter-spacing: .05em;
      color: #5f594f; }
    .intro .enter { position: absolute; bottom: 54px; font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 10px; letter-spacing: .18em; color: #5f5b54; display: flex; align-items: center; gap: 10px; }
    .intro .enter i { display: block; width: 1px; height: 22px; background: rgba(60,55,48,.45);
      animation: drop 1.9s ease-in-out infinite; }
    @keyframes drop { 0%,100% { transform: scaleY(.5); opacity: .45 } 50% { transform: scaleY(1); opacity: 1 } }
    body:not(.ready) .hint { opacity: 0; }
    .nav { display: flex; gap: 8px; pointer-events: auto; }
    .nav button { font-family: 'DM Mono', 'Courier New', monospace; font-size: 9.5px; letter-spacing: .12em;
      text-transform: uppercase;
      padding: 7px 13px; border: 1px solid rgba(43,41,38,.35); background: rgba(43,41,38,.92);
      color: #f3efe7; cursor: pointer; border-radius: 2px; transition: background .2s; }
    .nav button:hover { background: #000; }
    .nav button.on { background: #f3efe7; color: #2b2926; }

    .tag { position: fixed; z-index: 10; transform: translate(-50%, -50%); pointer-events: none;
      font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: .08em;
      padding: 5px 9px; background: rgba(28,27,25,.9); color: #f3efe7; border-radius: 2px;
      opacity: 0; transition: opacity .25s; white-space: nowrap; }
    .tag.show { opacity: 1; }
    .tag::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px;
      background: rgba(28,27,25,.6); }

    .paper-wrap { position: fixed; inset: 0; z-index: 15; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 11vh; pointer-events: none; opacity: 0; transition: opacity .45s; }
    .paper-wrap.show { opacity: 1; pointer-events: auto; }
    .paper { width: min(760px, 88vw); max-height: 82vh; overflow: auto; background: #f4efe4;
      padding: 42px 48px 48px; box-shadow: 0 18px 60px rgba(0,0,0,.28);
      transform: translateY(18px) scale(.985); transition: transform .5s cubic-bezier(.2,.8,.2,1);
      position: relative; }
    .paper-wrap.show .paper { transform: translateY(0) scale(1); }
    .paper::before { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(60,55,48,.12);
      pointer-events: none; }
    .close { position: absolute; top: 16px; right: 20px; border: 0; background: none; cursor: pointer;
      font-size: 22px; color: #6a655c; line-height: 1; }
    .tabs { display: flex; gap: 6px; margin-bottom: 30px; flex-wrap: wrap; }
    .tabs button { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: .04em;
      border: 1px solid rgba(60,55,48,.28); background: transparent; color: #4a453d;
      padding: 6px 10px; cursor: pointer; }
    .tabs button.on { background: #2b2926; color: #f4efe4; border-color: #2b2926; }
    .paper h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 35px; font-weight: 600;
      letter-spacing: .005em; margin-bottom: 8px; color: #22201c; line-height: 1.15; }
    .paper .sub { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: .1em;
      color: #888175; margin-bottom: 24px; text-transform: uppercase; }
    .paper p { font-family: 'Inter', -apple-system, sans-serif; font-size: 13.5px; line-height: 1.95;
      color: #3d3933; margin-bottom: 18px; max-width: 60ch; }
    .paper .rule { height: 1px; background: rgba(60,55,48,.2); margin: 22px 0; }
    .paper .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .paper .meta span { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; padding: 4px 8px;
      border: 1px solid rgba(60,55,48,.25); color: #5c564d; }
    .paper a { color: #8a4a2e; }
    .hint { position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; z-index: 12;
      font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: .1em; color: #55514a;
      pointer-events: none; transition: opacity .4s; }
    .paper-wrap.show ~ .hint { opacity: 0; }

    /* ---- 电脑里面：简笔 Finder ---- */
    .desktop { position: fixed; inset: 0; z-index: 18; background: #c9c3b6; display: none;
      align-items: center; justify-content: center; opacity: 0; transition: opacity .35s; }
    .desktop.show { display: flex; opacity: 1; }
    .os { width: min(1080px, 92vw); height: min(680px, 88vh); background: #f4efe4;
      border: 2px solid #3b3833; box-shadow: 10px 10px 0 rgba(59,56,51,.28);
      display: flex; flex-direction: column; transform: translateY(14px); transition: transform .4s; }
    .desktop.show .os { transform: translateY(0); }
    .osbar { height: 34px; flex: 0 0 34px; border-bottom: 2px solid #3b3833; display: flex;
      align-items: center; gap: 22px; padding: 0 16px; font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 11px; color: #3b3833; background: #eae4d6; }
    .osbar .b { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 14px; }
    .osbar .clock { margin-left: auto; }
    .osbody { display: flex; flex: 1; min-height: 0; }
    .sidebar { width: 190px; flex: 0 0 190px; border-right: 2px solid #3b3833; padding: 18px 12px;
      background: #e6dfd0; overflow: auto; }
    .sidebar .cap { font-family: 'DM Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: .12em;
      color: #8b857b; margin: 4px 8px 12px; }
    .side-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; cursor: pointer;
      font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; color: #3b3833; }
    .side-item:hover, .side-item.on { background: #d6cdb9; }
    .side-item .ico { width: 16px; height: 12px; background: #b9915c; border: 1.5px solid #3b3833;
      position: relative; flex: 0 0 16px; }
    .side-item .ico::before { content: ''; position: absolute; left: 0; top: -5px; width: 8px; height: 5px;
      background: #b9915c; border: 1.5px solid #3b3833; border-bottom: 0; }
    .mainPane { flex: 1; padding: 26px 30px; overflow: auto; position: relative; }
    .crumb { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; color: #8b857b;
      letter-spacing: .08em; margin-bottom: 24px; }
    .folders { display: grid; grid-template-columns: repeat(auto-fill, 118px); gap: 26px 18px; }
    .folder { cursor: pointer; text-align: center; }
    .folder .glyph { width: 74px; height: 52px; margin: 0 auto 10px; background: #c79a61;
      border: 2px solid #3b3833; position: relative; box-shadow: 4px 4px 0 rgba(59,56,51,.2); }
    .folder .glyph::before { content: ''; position: absolute; left: -2px; top: -10px; width: 34px; height: 10px;
      background: #c79a61; border: 2px solid #3b3833; border-bottom: 0; }
    .folder.closed .glyph { background: #b8916a; }
    .folder .name { font-family: 'Inter', -apple-system, sans-serif; font-size: 13.5px; color: #2f2c28; }
    .folder .count { font-family: 'DM Mono', 'Courier New', monospace; font-size: 9px; color: #8b857b; }
    .folder:hover .glyph { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(59,56,51,.25); }
    .files { display: none; }
    .files.show { display: block; }
    .files .back { font-family: 'DM Mono', 'Courier New', monospace; font-size: 10px; color: #8a4a2e;
      cursor: pointer; border: 0; background: none; margin-bottom: 20px; padding: 0; }
    .file-row { display: flex; align-items: baseline; gap: 14px; padding: 13px 4px;
      border-bottom: 1px solid rgba(59,56,51,.18); cursor: pointer; }
    .file-row:hover { background: #ece5d6; }
    .file-row .date { font-family: 'DM Mono', 'Courier New', monospace; font-size: 11px; color: #8b857b; flex: 0 0 92px; }
    .file-row .t { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; color: #2f2c28; }
