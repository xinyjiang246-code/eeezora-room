.backdrop::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(30,26,20,.10),rgba(30,26,20,0) 38%,rgba(30,26,20,.16))}
.light{position:absolute;left:-10%;top:-20%;width:70%;height:120%;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,252,238,.42),rgba(255,252,238,0) 58%);
  transform:skewX(-14deg) translateZ(-80px)}

/* 物件：沿一条纵深通道，从远处向镜头走来 */
.stations{position:absolute;inset:0;transform-style:preserve-3d}
.station{position:absolute;left:50%;top:42%;width:520px;height:360px;margin-left:-260px;
  transform-style:preserve-3d;will-change:transform,opacity,filter;transform-origin:center center;cursor:pointer}
.station img{max-width:100%;max-height:100%;width:auto;height:auto;margin:0 auto;display:block;
  filter:drop-shadow(0 30px 34px rgba(28,20,12,.5)) drop-shadow(0 8px 12px rgba(28,20,12,.3))}
.station .tag{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(-1.4deg);
  white-space:nowrap;background:#2a241d;color:#f2ece0;padding:7px 16px;
  font-family:Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.03em;
  box-shadow:0 5px 14px rgba(0,0,0,.35);border:1px solid rgba(240,232,214,.25)}
.station .tag::before{content:"";position:absolute;left:50%;top:-6px;width:9px;height:9px;
  background:#9c4a4a;border-radius:50%;transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.station .idx{position:absolute;right:10px;top:-18px;font:500 11px ui-monospace,monospace;color:#f0e8d8;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* 胶片颗粒 */
.grain{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/></svg>")}

/* 字标 */
.brand{position:fixed;z-index:15;left:50%;top:9%;transform:translateX(-50%);width:min(48vw,600px);
  pointer-events:none;transition:opacity .6s}
.brand svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 22px rgba(20,16,10,.5))}
.tagline{margin-top:12px;text-align:center;font-family:Georgia,serif;font-style:italic;
  font-size:clamp(14px,1.5vw,20px);color:#f2ece0;text-shadow:0 2px 8px rgba(0,0,0,.6);letter-spacing:.04em}

/* HUD */
.hud{position:fixed;z-index:30;top:20px;left:24px;right:24px;display:flex;align-items:center;gap:10px}
.hud button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(240,232,214,.5);
  background:rgba(30,26,20,.42);color:#f2ece0;cursor:pointer;font-size:15px;display:grid;place-items:center;
  backdrop-filter:blur(6px)}
.hud button:hover{background:rgba(30,26,20,.7)}
.hud .spacer{flex:1}
.hud .counter{font:500 12px ui-monospace,monospace;color:#f2ece0;background:rgba(30,26,20,.42);
  padding:7px 11px;border-radius:14px;border:1px solid rgba(240,232,214,.4);backdrop-filter:blur(6px)}
.hint{position:fixed;z-index:30;left:50%;bottom:26px;transform:translateX(-50%);
  font:400 12px ui-monospace,monospace;letter-spacing:.12em;color:#f4eee2;
  background:rgba(30,26,20,.42);padding:9px 18px;border-radius:20px;white-space:nowrap;
  border:1px solid rgba(240,232,214,.4);backdrop-filter:blur(6px);transition:opacity .5s}
.hint .arrow{display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* 过曝白光 */
.flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}

/* 毛边纸页（内容留空） */
.sheet{position:fixed;z-index:50;left:50%;top:50%;width:min(58vw,640px);
  transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;
  background:#f2ecdf;padding:54px 60px 46px;border:1px solid #d9cfbd;
  box-shadow:0 30px 90px rgba(20,14,8,.5);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:8px;
  background:radial-gradient(circle at 5px -2px,transparent 6px,#f2ecdf 7px) repeat-x;background-size:14px 8px}
.sheet::before{top:-7px;transform:rotate(180deg)} .sheet::after{bottom:-7px}
.sheet.open{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.sheet .kicker{font:500 11px ui-monospace,monospace;letter-spacing:.18em;color:#9a7b52}
.sheet h2{font-family:Georgia,serif;font-style:italic;font-weight:400;
  font-size:clamp(28px,3.4vw,46px);color:#332c22;margin:14px 0 22px}
.sheet .placeholder{border:1px dashed #c3b69e;background:rgba(255,255,255,.35);
  min-height:120px;display:grid;place-items:center;color:#9a8e7a;font-size:13px;letter-spacing:.05em}
.sheet .close{position:absolute;right:20px;top:18px;width:30px;height:30px;border:1px solid #c3b69e;
  border-radius:50%;background:transparent;color:#6d6252;cursor:pointer;font-size:16px}
body.sheet-open .brand,body.sheet-open .hint{opacity:0 !important}
</style>
</head>

var stationsData=[
  {key:'MAKING',title:'Making',img:'computer'},
  {key:'NOTICING',title:'Noticing',img:'book'},
  {key:'ABOUT',title:'About',img:'envelope'},
  {key:'LISTEN',title:'Listening',img:'headphone'}
];

/* 水钻宝石字标 */
function gem(cx,cy,R,rot){
  var n=8,s='',light=225*Math.PI/180,out=[],inn=[],i,a;
  function pt(r,i){a=(22.5+45*i+rot)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  for(i=0;i<n;i++){out.push(pt(R,i));inn.push(pt(R*.52,i));}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*1.06)+'" fill="#5f6b74"/>';
  for(i=0;i<n;i++){
    a=(22.5+45*i+22.5+rot)*Math.PI/180;
    var lum=.5+.5*Math.cos(a-light),v=Math.round(95+160*lum);
    var c='rgb('+v+','+Math.min(255,v+6)+','+Math.min(255,v+12)+')';
    var o0=out[i],o1=out[(i+1)%n],i1=inn[(i+1)%n],i0=inn[i];
    s+='<polygon points="'+o0[0]+','+o0[1]+' '+o1[0]+','+o1[1]+' '+i1[0]+','+i1[1]+' '+i0[0]+','+i0[1]+'" fill="'+c+'"/>';
  }
  s+='<polygon points="'+inn.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="#f7fbff"/>';
  var sq=R*.5,q=R*.12;
  s+='<path d="M '+cx+','+(cy-sq)+' L '+(cx+q)+','+(cy-q)+' L '+(cx+sq)+','+cy+' L '+(cx+q)+','+(cy+q)+' L '+cx+','+(cy+sq)+' L '+(cx-q)+','+(cy+q)+' L '+(cx-sq)+','+cy+' L '+(cx-q)+','+(cy-q)+' Z" fill="#fff"/>';
  s+='<circle cx="'+(cx-R*.28)+'" cy="'+(cy-R*.3)+'" r="'+(R*.2)+'" fill="#fff"/>';
  return s;
}
function buildBrand(){
  var fs=300,W=Math.round(fs*2.55),H=Math.round(fs*.97),B=Math.round(fs*.82),tl=Math.round(W*.94),sw=fs*.052;
  var tile=fs*.080*1.12,R=fs*.0150*1.45;
  var pat=gem(tile*.28,tile*.28,R)+gem(tile*.78,tile*.72,R*.86,22)+gem(tile*.46,tile*.92,R*.7,11);
  var svg=document.getElementById('brandSvg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.innerHTML='<defs>'+
   '<pattern id="gp" width="'+tile+'" height="'+tile+'" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">'+pat+'</pattern>'+
   '<mask id="gm"><text x="50%" y="'+B+'" text-anchor="middle" font-family="Goth" font-size="'+fs+'" letter-spacing="'+(-fs*.010)+'" textLength="'+tl+'" lengthAdjust="spacingAndGlyphs" fill="#fff">eeeZora</text></mask>'+
   '</defs>'+
   '<text x="50%" y="'+B+'" text-anchor="middle" font-family="Goth" font-size="'+fs+'" letter-spacing="'+(-fs*.010)+'" textLength="'+tl+'" lengthAdjust="spacingAndGlyphs" fill="#0a090d" stroke="#f3f7f8" stroke-width="'+sw+'" stroke-linejoin="round" paint-order="stroke">eeeZora</text>'+
   '<rect width="'+W+'" height="'+H+'" fill="url(#gp)" mask="url(#gm)"/>';
}

function buildStations(){
  var box=document.getElementById('stations');
  stationsData.forEach(function(s,i){
    var d=document.createElement('div');d.className='station';d.dataset.i=i;
    d.innerHTML='<div class="idx">0'+(i+1)+'</div><img src="'+IMG[s.img]+'" alt=""><div class="tag">'+s.title+'</div>';
    d.addEventListener('click',function(){openSheet(i);});
    box.appendChild(d);stationEls.push(d);
  });
}

var targetDepth=0,curDepth=0,ticking=false;
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var backdrop=document.getElementById('backdrop'),brand=document.getElementById('brand'),
    hint=document.getElementById('hint'),counter=document.getElementById('counter'),
    flash=document.getElementById('flash'),sheet=document.getElementById('sheet');
var stations=[0,.33,.66,1],stationEls=[];

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function nearestStation(d){var best=0,dist=9;stations.forEach(function(s,i){var dd=Math.abs(s-d);if(dd<dist){dist=dd;best=i;}});return best;}

function applyDepth(d){
  // 世界底图：推近时明显虚化+压暗，让清晰的物件从背景里"浮"出来
  backdrop.style.transform='translateZ(-300px) scale('+(1.35+d*.5)+') translateY('+(-d*4)+'%)';
  backdrop.style.filter='blur('+(d*6)+'px) brightness('+(1-d*.28)+')';

  // 物件沿 Z 轴依次走向镜头；收窄清晰区间，避免相邻两个同时显现
  stationEls.forEach(function(el,i){
    var delta=d-stations[i];
    var w=Math.exp(-Math.pow(delta/.105,2));
    var z=delta*700;
    var y=-delta*30+Math.max(0,delta)*50;
    var sc=clamp(.85+delta*1.6,.2,2.8);
    var op=clamp(w*1.15,0,1);
    el.style.transform='translate3d(0,'+y+'px,'+z+'px) scale('+sc+')';
    el.style.opacity=op;
    el.style.filter='blur('+clamp((1-w)*5,0,5)+'px)';
    el.style.pointerEvents=w>.42?'auto':'none';
  });

  brand.style.opacity=clamp(1-d*3.2,0,1);
  hint.style.opacity=clamp(1-d*1.6,0,1);
  counter.textContent='0'+(nearestStation(d)+1)+' / 0'+stations.length;
}

function tick(){
  var diff=targetDepth-curDepth;
  if(Math.abs(diff)<.0005){curDepth=targetDepth;ticking=false;applyDepth(curDepth);return;}
  curDepth=lerp(curDepth,targetDepth,reduced?1:.10);
  applyDepth(curDepth);requestAnimationFrame(tick);
}
function go(depth){targetDepth=clamp(depth,0,1);if(!ticking){ticking=true;requestAnimationFrame(tick);}}

var snapTimer=null,lastScrollAt=0;
function onScroll(delta){
  if(sheet.classList.contains('open'))return;
  var now=Date.now();
  if(now-lastScrollAt>260){/* 新手势 */}
  lastScrollAt=now;
  go(targetDepth+delta*.00075);
  clearTimeout(snapTimer);
  snapTimer=setTimeout(function(){
    if(Date.now()-lastScrollAt<260)return;
    go(stations[nearestStation(targetDepth)]);
  },300);
}
window.addEventListener('wheel',function(e){e.preventDefault();onScroll(e.deltaY);},{passive:false});

var touchY=null;
window.addEventListener('touchstart',function(e){touchY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchmove',function(e){
  if(touchY===null)return;e.preventDefault();
  var y=e.touches[0].clientY;onScroll((touchY-y)*2.2);touchY=y;
},{passive:false});
window.addEventListener('touchend',function(){touchY=null;},{passive:true});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='PageDown')onScroll(120);
  if(e.key==='ArrowUp'||e.key==='PageUp')onScroll(-120);
  if(e.key==='Escape')closeSheet();
});

var sheetHold=null;
function openSheet(i){
  if(sheet.classList.contains('open'))return;
  document.getElementById('sheetKicker').textContent='LAYER 0'+(i+1)+' · '+stationsData[i].key;
  document.getElementById('sheetTitle').textContent=stationsData[i].title;
  sheetHold=curDepth;go(0);
  if(reduced){sheet.classList.add('open');document.body.classList.add('sheet-open');return;}
  flash.style.transition='none';flash.style.opacity='0';
  requestAnimationFrame(function(){
    flash.style.transition='opacity .18s ease-in';flash.style.opacity='.95';
    setTimeout(function(){
      sheet.classList.add('open');document.body.classList.add('sheet-open');
      flash.style.transition='opacity .45s ease-out';flash.style.opacity='0';
    },190);
  });
}
function closeSheet(){
  sheet.classList.remove('open');document.body.classList.remove('sheet-open');
  if(sheetHold!==null){go(sheetHold);sheetHold=null;}
}
document.getElementById('sheetClose').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();});
document.getElementById('btnBack').addEventListener('click',function(){closeSheet();go(0);});
document.getElementById('btnMenu').addEventListener('click',function(){go(0);});
document.getElementById('btnSound').addEventListener('click',function(){this.style.color=this.style.color?'':'#9c4a4a';});

buildBrand();buildStations();applyDepth(0);
var m=location.search.match(/depth=([\d.]+)/);
if(m){var dv=clamp(parseFloat(m[1]),0,1);curDepth=targetDepth=dv;applyDepth(dv);}
window.__scene={go:go,getDepth:function(){return curDepth;},openSheet:openSheet,closeSheet:closeSheet};
})();
</script>
